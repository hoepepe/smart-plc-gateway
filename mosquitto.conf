# mosquitto.conf cho Smart PLC Gateway
# Cổng 1883: MQTT thường (script Python, ESP32, backend)
# Cổng 9001: WebSocket (dashboard chạy trên trình duyệt)
# Chỉ dùng trong mạng nội bộ khi test. allow_anonymous không an toàn cho môi trường thật.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
